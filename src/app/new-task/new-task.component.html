<app-modal>
  <div modal-body>
    <h2>Add Task</h2>
    <form (ngSubmit)="submitNewTask()">
      <p>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="taskModelObject.title" />
      </p>

      <p>
        <label for="summary">Summary</label>
        <textarea
          id="summary"
          rows="5"
          name="summary"
          [(ngModel)]="taskModelObject.summary"
        ></textarea>
      </p>

      <p>
        <label for="due-date">Due Date</label>
        <input type="date" id="due-date" name="due-date" [(ngModel)]="taskModelObject.dueDate" />
      </p>

      <p class="actions">
        <button type="button" (click)="cancelAddTask()">Cancel</button>
        <button type="submit">Create</button>
      </p>
    </form>
  </div>
</app-modal>
