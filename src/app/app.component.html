<app-header></app-header>
<main>
  <ul id="users">
    <li>
      <app-add-user (addUser)="onAddUser($event)"></app-add-user>    
    </li>
    @for (user of users;track user.id) {
      <li>
        <app-user [selectedUser]="user" (selectUser)="onSelectUser($event)"> </app-user>
      </li>
    }
  </ul>
  @if(selectedUser) {
    <app-task-list [selectedUser]="selectedUser"></app-task-list>
  }
  @else {
    <p>Please select an user</p>
  }
</main>
