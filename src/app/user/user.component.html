<div class="user-item" [ngClass]="{ 'active': selectedUser().selected }">
  <!-- User selection -->
  <button
    type="button"
    class="user-button"
    (click)="onSelectUser()">
    <img
      [src]="imagePath()"
      [alt]="selectedUser().name" />

    <span>{{ selectedUser().name }}</span>
  </button>

  <!-- Actions -->
  <div class="user-actions">
    <button
      type="button"
      class="action-button edit-button"
      (click)="onEditUser($event)"
      title="Edit user">
      <i class="fa-solid fa-pen"></i>
    </button>

    <button
      type="button"
      class="action-button delete-button"
      (click)="onDeleteUser($event)"
      title="Delete user">
      <i class="fa-solid fa-trash"></i>
    </button>
  </div>
</div>
